<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demo Genmab Video</title>

  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    :root { color-scheme: light; }

    body { margin: 0; background: #fff; }
    .wrap { padding: 0px; max-width: 1100px; margin: 0 auto; font-family: ff-meta-web-pro, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    video { width: 100%; height: auto; }

    .chapters {
      margin-top: 14px;
      display: grid;
      gap: 8px;
    }

    .chapter-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      line-height: 1.25;
    }

    .chapter-btn:hover { background: #f7f7f7; }
    .chapter-btn:active { transform: translateY(1px); }

    .chapter-time {
      display: inline-block;
      min-width: 64px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      margin-right: 10px;
    }

    .chapter-label { font-weight: 500; }

    .chapter-btn.is-active {
      border-color: #999;
      background: #f2f2f2;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="player" controls playsinline>
      <source src="./video.mp4" type="video/mp4" />
      <track kind="captions" label="English" srclang="en" src="./captions.vtt" default />
      <track kind="chapters" label="Chapters" srclang="en" src="./chapters.vtt" default />
    </video>

    <div id="chapterList" class="chapters" aria-label="Chapters"></div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const player = new Plyr('#player', {
      captions: {
        active: false,
        language: 'en',
        update: true
  },
      controls: [
        'play-large','play','progress','current-time','duration',
        'mute','volume','captions','settings','fullscreen'
      ],
      markers: {
        enabled: true,

        points: [
          { time: 0, label: 'Introduction' },
          { time: 24, label: 'Accessing the Design Kit' },
          { time: 64, label: 'Tour of the Design Kit' },
          { time: 141, label: 'Presets' },
          { time: 189, label: 'File Structure' },
          { time: 288, label: 'Adding Components' },
          { time: 382, label: 'Component Overview' },
          { time: 460, label: 'Variants and Properties' },
          { time: 520, label: 'Color, Styles, Effects' },
          { time: 596, label: 'Images' },
          { time: 743, label: 'Columns' }
    ]
  }
});
    });

    // Your chapters (seconds) + labels
    const chapters = [
      { t: 0,  time: '00:00', label: 'Introduction' },
      { t: 24, time: '00:24', label: 'Getting Started: Accessing the Design Kit' },
      { t: 64, time: '01:04', label: 'Getting Started: A Tour of the Design Kit' },
      { t: 141, time: '02:21', label: 'Designing a Website: Presets' },
      { t: 189, time: '03:09', label: 'Designing a Website: File Structure' },
      { t: 288, time: '04:48', label: 'Designing a Website: Adding Components' },
      { t: 382, time: '06:22', label: 'Using Components: Component Overview' },
      { t: 460, time: '07:40', label: 'Using Components: Variants and Properties' },
      { t: 520, time: '08:40', label: 'Using Components: Color, Styles, and Effects' },
      { t: 596, time: '09:56', label: 'Using Components: Images' },
      { t: 743, time: '12:23', label: 'Using Components: Columns' },
    ];

    const list = document.getElementById('chapterList');

    // Render buttons
    list.innerHTML = chapters.map((c, i) => `
      <button class="chapter-btn" type="button" data-t="${c.t}" data-i="${i}">
        <span class="chapter-time">${c.time}</span>
        <span class="chapter-label">${c.label}</span>
      </button>
    `).join('');

    // Click -> jump + play
    list.addEventListener('click', (e) => {
      const btn = e.target.closest('.chapter-btn');
      if (!btn) return;

      const t = Number(btn.dataset.t);
      player.currentTime = t;
      player.play();

      setActive(Number(btn.dataset.i));
    });

    // Highlight active chapter based on current time
    function setActive(activeIndex) {
      document.querySelectorAll('.chapter-btn').forEach((b) => b.classList.remove('is-active'));
      const active = document.querySelector(`.chapter-btn[data-i="${activeIndex}"]`);
      if (active) active.classList.add('is-active');
    }

    // Update active chapter while playing
    player.on('timeupdate', () => {
      const ct = player.currentTime;
      let idx = 0;
      for (let i = 0; i < chapters.length; i++) {
        if (ct >= chapters[i].t) idx = i;
      }
      setActive(idx);
    });
  </script>
</body>
</html>
